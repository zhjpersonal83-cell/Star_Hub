limit_req_zone $binary_remote_addr zone=starhub_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=starhub_realtime:1m;
server {
    listen 80;
    server_name starhub.zhongjiehuang.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/starhub-acme; }
    location / { return 301 https://starhub.zhongjiehuang.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name starhub.zhongjiehuang.com;
    ssl_certificate /etc/letsencrypt/live/starhub.zhongjiehuang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starhub.zhongjiehuang.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    client_body_buffer_size 6m;
    proxy_request_buffering off;
    client_body_timeout 15s;
    access_log /var/log/nginx/starhub-access.log;
    error_log /var/log/nginx/starhub-error.log;
    location = /realtime {
        limit_conn starhub_realtime 2;
        proxy_pass http://127.0.0.1:8080/starhub/realtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 1800s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location ~ ^/api/(chat|run|batch|check)$ {
        proxy_buffering off;
        gzip off;
        limit_req zone=starhub_api burst=5 nodelay;
        limit_req_status 429;
        rewrite ^/api/(chat|run|batch|check)$ /starhub/api/$1 break;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/starhub-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8080/starhub/;
        include /etc/nginx/snippets/starhub-proxy.conf;
    }
}
